[package]
name = "monstertruck-meshing"
version = "0.3.3"
authors = ["Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
description = "Tessellation and meshing algorithms for B-rep shapes"
homepage = "https://github.com/virtualritz/monstertruck"
repository = "https://github.com/virtualritz/monstertruck"
license = "Apache-2.0"

keywords = ["truck", "graphics", "mesh"]
categories = ["graphics"]

[features]
analyzers = []
filters = []
tessellation = ["spade", "filters"]
# Legacy-VTK mesh I/O. Off by default: `vtkio` pulls `lz4_flex`, which carries
# RUSTSEC-2026-0041, so opting in is explicit. Enable with `--features vtk`.
vtk = ["vtkio"]
default = ["analyzers", "filters", "tessellation"]

[dependencies]
# `web_time::Instant` is `std::time::Instant` on native and falls back
# to `performance.now()` on wasm32-unknown-unknown (where std::time::*
# panics).
web-time = { workspace = true }
array-macro = { workspace = true }
derive_more = { workspace = true }
itertools = { workspace = true }
rustc-hash = { workspace = true }
spade = { workspace = true, optional = true }
monstertruck-core = { workspace = true }
monstertruck-geometry = { workspace = true }
monstertruck-mesh = { workspace = true }
monstertruck-topology = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
vtkio = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
proptest = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
monstertruck-modeling = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
getrandom = { workspace = true }

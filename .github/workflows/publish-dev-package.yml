name: Publish dev package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Container Registry tag
        required: true
        default: dev-pkg
        type: string

permissions:
  contents: read
  packages: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  package:
    name: test and publish source package
    if: github.ref_name == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Fetch public resources
        run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test workspace
        run: cargo test
      - uses: oras-project/setup-oras@v1
      - name: Assemble source package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p package staging/monstertruck/resources
          git archive --format=tar HEAD | tar -xf - -C staging/monstertruck
          git -C resources archive --format=tar HEAD \
            | tar -xf - -C staging/monstertruck/resources

          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg ref "$GITHUB_REF_NAME" \
            --arg revision "$GITHUB_SHA" \
            --arg resources_revision "$(git -C resources rev-parse HEAD)" \
            '{
              repository: $repository,
              ref: $ref,
              revision: $revision,
              resources_revision: $resources_revision
            }' > package/manifest.json

          tar \
            --sort=name \
            --mtime='UTC 1970-01-01' \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf - \
            -C staging monstertruck \
            | gzip -n > package/monstertruck-source.tar.gz
          sha256sum package/manifest.json package/monstertruck-source.tar.gz \
            > package/SHA256SUMS
      - name: Log in to GitHub Container Registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" \
            | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish package
        shell: bash
        env:
          PACKAGE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          package_owner="${GITHUB_REPOSITORY_OWNER,,}"
          package="ghcr.io/${package_owner}/monstertruck:${PACKAGE_TAG}"
          oras push "$package" \
            --artifact-type application/vnd.monstertruck.prototype.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.description=Monstertruck dev prototype source package" \
            package/monstertruck-source.tar.gz:application/vnd.monstertruck.source.v1+gzip \
            package/manifest.json:application/vnd.monstertruck.manifest.v1+json \
            package/SHA256SUMS:text/plain

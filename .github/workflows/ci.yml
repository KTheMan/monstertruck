name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      # `rustfmt.toml` opts into unstable options (`fn_single_line`,
      # `where_single_line`, `brace_style = "PreferSameLine"`); stable
      # rustfmt silently ignores those, so the fmt check has to run on
      # nightly to actually apply them.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: cargo nextest (cpu)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # Pinned: cargo-rdme's output is not stable across major versions, so an
      # unpinned `@latest` would fail `readme-check` the day it majors.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-rdme@2.1.0
      - uses: extractions/setup-just@v2
      - run: just readme-check
      - run: just test-cpu
      - run: just test-doc

  continuity-validation:
    name: continuity validation corpus
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace still expects the public resources submodule.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # `cadquery-ocp` 7.9.3.1.1 packages the OCCT 7.9.3.1 kernel used by the
      # command-line STEP validity oracle below.
      - run: python -m pip install --disable-pip-version-check cadquery-ocp==7.9.3.1.1
      # Emit mode checks tolerances and immediate-rerun determinism without
      # requiring host-sensitive digest equality with the Windows baseline.
      - run: >-
          cargo run -p monstertruck-geometry
          --example continuity-validation --
          --emit target/continuity-validation-ci.json
      - run: >-
          cargo run -p monstertruck-io
          --example continuity-repair-step --
          --out target/continuity-repaired.step
      - run: >-
          python validation/continuity/validate_occt.py
          target/continuity-repaired.step

  topology-state-validation:
    name: topology state validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The workspace still expects the public resources submodule.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo run -p monstertruck-topology
          --example topology-state-validation --
          --check validation/topology/topology-state-snapshot-v1.json

  meshing-features:
    name: monstertruck-meshing feature subsets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just meshing-features

  wasm-build:
    name: cargo build (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # CI cannot clone the `.blueprints` submodule (agent tooling), so do
          # not recurse. Jobs that compile or run code fetch the public
          # `resources` submodule explicitly below.
          submodules: false
      - run: git submodule update --init resources
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - run: just wasm-build

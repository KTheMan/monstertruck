[package]
name = "monstertruck-sketch"
version = "0.3.2"
authors = ["Yoshinori Tanimura <tanimura@ricos.co.jp>", "Moritz Moeller <virtualritz@protonmail.com>"]
edition = "2024"
description = "2D sketch construction: vertices, lines, arcs, and corner treatments (fillet, chamfer)"
homepage = "https://github.com/virtualritz/monstertruck"
repository = "https://github.com/virtualritz/monstertruck"
license = "Apache-2.0"

keywords = ["cad", "sketch", "2d", "fillet", "chamfer"]
categories = ["graphics", "mathematics"]

[dependencies]
derive_more = { workspace = true }
itertools = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
monstertruck-core = { workspace = true }
monstertruck-geometry = { workspace = true }
monstertruck-traits = { workspace = true, features = ["derive"] }
monstertruck-topology = { workspace = true }

[dev-dependencies]
proptest = { workspace = true, features = ["attr-macro"] }
